# Force Gradle daemon to run on JDK 25 (Minecraft 26.2 requires it).
# Note: forward slashes are used on purpose so this parses as a normal property.
org.gradle.java.home=O:/MohistServer/JDK25/jdk-25.0.1

# MC 26.2 ships an unobfuscated (already named) jar and has no Yarn/mojang mappings.
# Tell Loom to skip the obfuscation/remapping pipeline entirely.
fabric.loom.disableObfuscation=true

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.0-alpha.20

# Mod Properties
version=1.1.4
maven_group=com.wikievery
archives_base_name=wikievery

# Dependencies
fabric_api_version=0.159.0+26.2
